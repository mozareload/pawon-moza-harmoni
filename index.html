<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawon Moza Harmoni - Katalog Menu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased pb-24">
    <header class="bg-amber-600 text-white shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-6 text-center">
            <h1 class="text-2xl font-bold tracking-tight">PAWON MOZA HARMONI</h1>
            <p class="text-amber-100 text-sm mt-1">Aneka Menu Rumahan Lezat & Higienis</p>
            <div id="store-status" class="inline-block mt-3 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-700 text-emerald-100">
                🟢 Toko Buka - Silakan Pesan
            </div>
        </div>
    </header>
    <main class="max-w-3xl mx-auto px-4 mt-6">
        <div class="mb-6 space-y-4">
            <div class="relative">
                <input type="text" id="search-input" placeholder="Cari menu kesukaan Anda..." 
                    class="w-full px-4 py-3 pl-10 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-sm">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <div id="category-container" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
                <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 bg-amber-600 text-white text-xs font-semibold rounded-full whitespace-nowrap shadow-sm transition">Semua Menu</button>
            </div>
        </div>
        <div id="menu-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </main>
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg p-4 transition-transform duration-300 transform translate-y-full">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div>
                <p class="text-xs text-gray-500 font-medium">Total Pesanan (<span id="cart-count">0</span> item)</p>
                <p id="cart-total" class="text-lg font-bold text-amber-600">Rp 0</p>
            </div>
            <button onclick="openCartModal()" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-6 py-2.5 rounded-xl text-sm shadow-md transition flex items-center gap-2">
                <span>Lihat Keranjang</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </div>
    </div>
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-2xl animate-slide-up">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-bold text-lg">Detail Pesanan Anda</h3>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600 p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="cart-items-list" class="p-4 overflow-y-auto flex-1 space-y-3"></div>
            <div class="p-4 border-t border-gray-100 bg-gray-50 space-y-3 rounded-b-2xl">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Catatan Tambahan / Alamat Pengiriman</label>
                    <input type="text" id="buyer-note" placeholder="Contoh: Kurang pedas, alamat Jl. Mawar No. 5" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                    <span>Kirim Pesanan via WhatsApp</span>
                </button>
            </div>
        </div>
    </div>
    <script>
        let menuData = { whatsapp: "6281234567890", categories: [], items: [] };
        let cart = {};
        let currentCategory = 'all';
        async function loadMenu() {
            try {
                const res = await fetch('menu.json');
                menuData = await res.json();
                renderCategories();
                renderMenu();
            } catch (e) { console.error(e); }
        }
        function renderCategories() {
            const c = document.getElementById('category-container');
            menuData.categories.forEach(cat => {
                const b = document.createElement('button');
                b.className = "cat-btn px-4 py-2 bg-white text-gray-600 border border-gray-200 text-xs font-semibold rounded-full whitespace-nowrap shadow-sm transition hover:bg-amber-50";
                b.textContent = cat.name;
                b.onclick = () => filterCategory(cat.id, b);
                c.appendChild(b);
            });
        }
        function filterCategory(id, el) {
            currentCategory = id;
            document.querySelectorAll('.cat-btn').forEach(b => b.className = "cat-btn px-4 py-2 bg-white text-gray-600 border border-gray-200 text-xs font-semibold rounded-full whitespace-nowrap shadow-sm transition hover:bg-amber-50");
            if(el) el.className = "cat-btn px-4 py-2 bg-amber-600 text-white text-xs font-semibold rounded-full whitespace-nowrap shadow-sm transition";
            renderMenu();
        }
        function renderMenu() {
            const container = document.getElementById('menu-container');
            const search = document.getElementById('search-input').value.toLowerCase();
            container.innerHTML = '';
            const filtered = menuData.items.filter(i => (currentCategory === 'all' || i.category === currentCategory) && (i.name.toLowerCase().includes(search) || i.desc.toLowerCase().includes(search)));
            if (filtered.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-400 py-8 text-sm">Menu tidak ditemukan.</p>`;
                return;
            }
            filtered.forEach(item => {
                const q = cart[item.id] || 0;
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-100 rounded-2xl p-4 shadow-sm flex flex-col justify-between hover:shadow-md transition";
                card.innerHTML = `
                    <div class="flex gap-4">
                        <img src="${item.image}" alt="${item.name}" class="w-20 h-20 object-cover rounded-xl bg-gray-100 flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-sm text-gray-800 truncate">${item.name}</h4>
                            <p class="text-xs text-gray-500 mt-1 line-clamp-2">${item.desc}</p>
                        </div>
                    </div>
                    <div class="mt-4 flex items-center justify-between pt-3 border-t border-gray-50">
                        <span class="font-bold text-amber-600 text-sm">Rp ${item.price.toLocaleString('id-ID')}</span>
                        <div class="flex items-center gap-2">
                            ${q > 0 ? `<button onclick="updateCart('${item.id}', -1)" class="w-8 h-8 rounded-lg bg-gray-100 text-gray-600 font-bold flex items-center justify-center">-</button><span class="text-sm font-bold w-4 text-center">${q}</span>` : ''}
                            <button onclick="updateCart('${item.id}', 1)" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-semibold shadow-sm transition">${q > 0 ? '+' : 'Tambah'}</button>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
        }
        document.getElementById('search-input').addEventListener('input', renderMenu);
        function updateCart(id, d) {
            cart[id] = (cart[id] || 0) + d;
            if (cart[id] <= 0) delete cart[id];
            updateCartUI();
            renderMenu();
        }
        function updateCartUI() {
            let count = 0, price = 0;
            for (let id in cart) {
                const item = menuData.items.find(i => i.id === id);
                if (item) { count += cart[id]; price += item.price * cart[id]; }
            }
            document.getElementById('cart-count').textContent = count;
            document.getElementById('cart-total').textContent = `Rp ${price.toLocaleString('id-ID')}`;
            const bar = document.getElementById('cart-bar');
            if (count > 0) bar.classList.remove('translate-y-full');
            else bar.classList.add('translate-y-full');
        }
        function openCartModal() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            for (let id in cart) {
                const item = menuData.items.find(i => i.id === id);
                if (item) {
                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between text-sm py-2 border-b border-gray-50";
                    row.innerHTML = `<div><p class="font-semibold text-gray-800">${item.name}</p><p class="text-xs text-gray-500">Rp ${item.price.toLocaleString('id-ID')} x ${cart[id]}</p></div><div class="font-bold text-amber-600">Rp ${(item.price * cart[id]).toLocaleString('id-ID')}</div>`;
                    list.appendChild(row);
                }
            }
            document.getElementById('cart-modal').classList.remove('hidden');
        }
        function closeCartModal() { document.getElementById('cart-modal').classList.add('hidden'); }
        function sendToWhatsApp() {
            let text = "Halo Pawon Moza Harmoni, saya ingin memesan:\n\n";
            let total = 0;
            for (let id in cart) {
                const item = menuData.items.find(i => i.id === id);
                if (item) {
                    text += `- ${item.name} (${cart[id]}x) = Rp ${(item.price * cart[id]).toLocaleString('id-ID')}\n`;
                    total += item.price * cart[id];
                }
            }
            const note = document.getElementById('buyer-note').value;
            if (note) text += `\nCatatan: ${note}`;
            text += `\n*Total Keseluruhan: Rp ${total.toLocaleString('id-ID')}*`;
            window.open(`https://wa.me/${menuData.whatsapp}?text=${encodeURIComponent(text)}`, '_blank');
        }
        loadMenu();
    </script>
</body>
</html>
