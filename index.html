<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pawon Moza Harmoni - Katalog Menu</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        /* Sembunyikan scrollbar tapi tetap bisa digeser */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased min-h-screen flex flex-col justify-between pb-24">

    <div>
        <!-- Header / Banner -->
        <header class="bg-gradient-to-r from-amber-600 to-amber-700 text-white shadow-lg">
            <div class="max-w-3xl mx-auto px-4 py-6 text-center">
                <!-- Info Tanggal & Jam Real-Time -->
                <div class="mb-2 text-xs font-medium text-amber-200 bg-amber-800/40 inline-block px-3 py-1 rounded-full backdrop-blur-sm shadow-inner" id="live-clock">
                    Memuat waktu...
                </div>
                
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight" id="store-title">PAWON MOZA HARMONI</h1>
                <p class="text-amber-100 text-sm mt-1 max-w-md mx-auto" id="store-tagline">Sentuhan Rasa Autentik Masakan Rumahan Berkualitas</p>
                
                <!-- Status Toko Badge -->
                <div class="inline-flex items-center gap-1.5 mt-3 px-3.5 py-1 rounded-full text-xs font-semibold bg-emerald-600 text-emerald-50 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span>
                    <span>Toko Buka - Silakan Pesan</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-3xl mx-auto px-4 mt-6">
            
            <!-- Search & Filter Section -->
            <div class="mb-6 space-y-3">
                <div class="relative shadow-sm">
                    <input type="text" id="search-input" placeholder="Cari menu kesukaan Anda..." 
                        class="w-full px-4 py-3.5 pl-11 bg-white border border-gray-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                    <svg class="w-5 h-5 text-gray-400 absolute left-3.5 top-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>

                <!-- Kategori Filter -->
                <div id="category-container" class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                    <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 bg-amber-600 text-white text-xs font-semibold rounded-full whitespace-nowrap shadow-sm transition">Semua Menu</button>
                </div>
            </div>

            <!-- Daftar Menu Grid -->
            <div id="menu-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Data dimuat dinamis dari JavaScript -->
            </div>

        </main>
    </div>

    <!-- Footer -->
    <footer class="mt-16 py-6 text-center text-xs text-gray-500 border-t border-gray-200 bg-white">
        <p>&copy; <span id="current-year"></span> Pawon Moza Harmoni. Dibuat dengan ❤️ oleh <span class="font-semibold text-gray-700">Dodi Tabrani</span>.</p>
    </footer>

    <!-- Floating Cart Bar -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 shadow-2xl p-4 transition-transform duration-300 transform translate-y-full z-40">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div>
                <p class="text-xs text-gray-500 font-medium">Total Pesanan (<span id="cart-count">0</span> item)</p>
                <p id="cart-total" class="text-lg font-bold text-amber-600">Rp 0</p>
            </div>
            <button onclick="openCartModal()" class="bg-amber-600 hover:bg-amber-700 text-white font-semibold px-6 py-3 rounded-xl text-sm shadow-md transition flex items-center gap-2 active:scale-95">
                <span>Lihat Keranjang</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
            </button>
        </div>
    </div>

    <!-- Modal Keranjang / Checkout -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
                <h3 class="font-bold text-base text-gray-800">Detail Pesanan Anda</h3>
                <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600 p-1.5 rounded-full hover:bg-gray-200/50 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="cart-items-list" class="p-4 overflow-y-auto flex-1 space-y-3">
                <!-- Item keranjang -->
            </div>
            <div class="p-4 border-t border-gray-100 bg-gray-50 space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Catatan Tambahan / Alamat Pengiriman</label>
                    <input type="text" id="buyer-note" placeholder="Contoh: Kurang pedas, alamat Jl. Mawar No. 5" class="w-full px-3.5 py-2.5 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-sm">
                </div>
                <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm active:scale-[0.99]">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                    <span>Kirim Pesanan via WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Aplikasi -->
    <script>
        // Set Tahun Otomatis di Footer
        document.getElementById('current-year').textContent = new Date().getFullYear();

        // Widget Live Tanggal dan Jam
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('id-ID', options);
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const clockEl = document.getElementById('live-clock');
            if (clockEl) {
                clockEl.textContent = `📅 ${dateStr} | ⏰ ${timeStr} WIB`;
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        let menuData = { whatsapp: "6281234567890", categories: [] };
        let allItems = [];
        let cart = {};
        let currentCategory = 'all';

        async function loadMenu() {
            try {
                const response = await fetch('menu.json');
                menuData = await response.json();
                
                if (menuData.store_name) document.getElementById('store-title').textContent = menuData.store_name;
                if (menuData.tagline) document.getElementById('store-tagline').textContent = menuData.tagline;

                allItems = [];
                if (menuData.categories) {
                    menuData.categories.forEach(cat => {
                        if (cat.items) {
                            cat.items.forEach(item => {
                                item.category = cat.id;
                                allItems.push(item);
                            });
                        }
                    });
                }

                renderCategories();
                renderMenu();
            } catch (error) {
                console.error('Gagal memuat menu:', error);
            }
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            if (!container || !menuData.categories) return;
            
            menuData.categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-btn px-4 py-2 bg-white text-gray-600 border border-gray-200 text-xs font-semibold rounded-full whitespace-nowrap shadow-sm transition hover:bg-amber-50`;
                btn.textContent = cat.name;
                btn.onclick = () => filterCategory(cat.id, btn);
                container.appendChild(btn);
            });
        }

        function filterCategory(catId, element) {
            currentCategory = catId;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn px-4 py-2 bg-white text-gray-600 border border-gray-200 text-xs font-semibold rounded-full whitespace-nowrap shadow-sm transition hover:bg-amber-50";
            });
            if(element) {
                element.className = "cat-btn px-4 py-2 bg-amber-600 text-white text-xs font-semibold rounded-full whitespace-nowrap shadow-sm transition";
            } else {
                const firstBtn = document.querySelector('.cat-btn');
                if(firstBtn) firstBtn.className = "cat-btn px-4 py-2 bg-amber-600 text-white text-xs font-semibold rounded-full whitespace-nowrap shadow-sm transition";
            }
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menu-container');
            const searchInput = document.getElementById('search-input');
            if (!container) return;
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';
            container.innerHTML = '';

            const filtered = allItems.filter(item => {
                const matchCat = currentCategory === 'all' || item.category === currentCategory;
                const matchSearch = item.name.toLowerCase().includes(searchTerm) || item.desc.toLowerCase().includes(searchTerm);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-400 py-12 text-sm">Menu tidak ditemukan.</p>`;
                return;
            }

            filtered.forEach(item => {
                const qty = cart[item.id] || 0;
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-100 rounded-2xl p-4 shadow-sm flex flex-col justify-between hover:shadow-md transition relative overflow-hidden group";
                
                let badgeHtml = item.badge ? `<span class="absolute top-3 right-3 bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full z-10 shadow-sm">${item.badge}</span>` : '';

                card.innerHTML = `
                    ${badgeHtml}
                    <div>
                        <div class="flex gap-4">
                            <img src="${item.image}" alt="${item.name}" class="w-20 h-20 sm:w-24 sm:h-24 object-cover rounded-xl bg-gray-100 flex-shrink-0 group-hover:scale-105 transition duration-300">
                            <div class="flex-1 min-w-0 pr-4">
                                <h4 class="font-bold text-sm sm:text-base text-gray-800 truncate">${item.name}</h4>
                                <p class="text-xs text-gray-500 mt-1 line-clamp-2 leading-relaxed">${item.desc}</p>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 flex items-center justify-between pt-3 border-t border-gray-100">
                        <span class="font-bold text-amber-600 text-sm sm:text-base">Rp ${item.price.toLocaleString('id-ID')}</span>
                        <div class="flex items-center gap-2">
                            ${qty > 0 ? `
                                <button onclick="updateCart('${item.id}', -1)" class="w-8 h-8 rounded-lg bg-gray-100 text-gray-700 font-bold flex items-center justify-center hover:bg-gray-200 transition">-</button>
                                <span class="text-sm font-bold w-4 text-center">${qty}</span>
                            ` : ''}
                            <button onclick="updateCart('${item.id}', 1)" class="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-semibold shadow-sm transition active:scale-95">
                                ${qty > 0 ? '+' : 'Tambah'}
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        const searchEl = document.getElementById('search-input');
        if(searchEl) {
            searchEl.addEventListener('input', renderMenu);
        }

        function updateCart(itemId, delta) {
            cart[itemId] = (cart[itemId] || 0) + delta;
            if (cart[itemId] <= 0) delete cart[itemId];
            updateCartUI();
            renderMenu();
        }

        function updateCartUI() {
            let totalCount = 0;
            let totalPrice = 0;

            for (let id in cart) {
                const item = allItems.find(i => i.id === id);
                if (item) {
                    totalCount += cart[id];
                    totalPrice += item.price * cart[id];
                }
            }

            document.getElementById('cart-count').textContent = totalCount;
            document.getElementById('cart-total').textContent = `Rp ${totalPrice.toLocaleString('id-ID')}`;

            const cartBar = document.getElementById('cart-bar');
            if (totalCount > 0) {
                cartBar.classList.remove('translate-y-full');
            } else {
                cartBar.classList.add('translate-y-full');
            }
        }

        function openCartModal() {
            const list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            
            for (let id in cart) {
                const item = allItems.find(i => i.id === id);
                if (item) {
                    const row = document.createElement('div');
                    row.className = "flex items-center justify-between text-sm py-2.5 border-b border-gray-100";
                    row.innerHTML = `
                        <div>
                            <p class="font-semibold text-gray-800">${item.name}</p>
                            <p class="text-xs text-gray-500">Rp ${item.price.toLocaleString('id-ID')} x ${cart[id]}</p>
                        </div>
                        <div class="font-bold text-amber-600">Rp ${(item.price * cart[id]).toLocaleString('id-ID')}</div>
                    `;
                    list.appendChild(row);
                }
            }
            document.getElementById('cart-modal').classList.remove('hidden');
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        function sendToWhatsApp() {
            let text = "Halo Pawon Moza Harmoni, saya ingin memesan:\n\n";
            let totalPrice = 0;

            for (let id in cart) {
                const item = allItems.find(i => i.id === id);
                if (item) {
                    text += `- ${item.name} (${cart[id]}x) = Rp ${(item.price * cart[id]).toLocaleString('id-ID')}\n`;
                    totalPrice += item.price * cart[id];
                }
            }

            const note = document.getElementById('buyer-note').value;
            if (note) text += `\nCatatan: ${note}`;
            text += `\n*Total Keseluruhan: Rp ${totalPrice.toLocaleString('id-ID')}*`;

            const url = `https://wa.me/${menuData.whatsapp}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }

        loadMenu();
    </script>
</body>
</html>
